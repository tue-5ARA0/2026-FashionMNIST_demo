<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Fashion-MNIST · Class Review</title>
  <style>
    :root {
      --ink: #f8f7ff;
      --muted: #b9bdd1;
      --panel: rgba(20, 23, 42, 0.82);
      --panel-strong: #171a31;
      --line: rgba(255, 255, 255, 0.12);
      --purple: #9b8cff;
      --cyan: #5ee7df;
      --yellow: #ffd166;
      --green: #7ce7ac;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 8%, rgba(155, 140, 255, 0.22), transparent 34rem),
        radial-gradient(circle at 90% 90%, rgba(94, 231, 223, 0.16), transparent 36rem),
        #0b0d19;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    button { font: inherit; }

    .app {
      width: min(1180px, calc(100% - 32px));
      min-height: 100vh;
      margin: auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 20px;
      padding: 24px 0;
      position: relative;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: #0b0d19;
      font-weight: 900;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      box-shadow: 0 10px 30px rgba(94, 231, 223, 0.2);
    }

    .brand-copy strong { display: block; font-size: 0.98rem; letter-spacing: .01em; }
    .brand-copy span { color: var(--muted); font-size: 0.78rem; }

    .top-meta { display: flex; align-items: center; gap: 14px; color: var(--muted); }

    .counter {
      min-width: 74px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      text-align: center;
      font-size: .83rem;
      background: rgba(255,255,255,.04);
    }

    .progress-track {
      width: min(260px, 25vw);
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.09);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      transition: width .35s ease;
    }

    main { display: grid; place-items: center; min-height: 0; }

    .slide {
      width: 100%;
      min-height: min(720px, calc(100vh - 180px));
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      animation: arrive .35s ease both;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px) scale(.992); }
      to { opacity: 1; transform: none; }
    }

    .question-panel, .answer-panel { padding: clamp(28px, 4.5vw, 58px); }

    .question-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background:
        radial-gradient(circle at 10% 0%, rgba(155,140,255,.16), transparent 48%),
        rgba(255,255,255,.015);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      color: var(--cyan);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 18px currentColor;
    }

    h1 {
      max-width: 16ch;
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 4rem);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .prompt {
      max-width: 55ch;
      margin: 0 0 26px;
      color: var(--muted);
      font-size: clamp(.92rem, 1.4vw, 1.08rem);
      line-height: 1.55;
    }

    .questions, .answers { margin: 0; padding: 0; list-style: none; }

    .questions { display: grid; gap: 12px; }

    .questions li {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 12px;
      align-items: start;
      color: #eaebf5;
      line-height: 1.45;
      font-size: clamp(.9rem, 1.25vw, 1.03rem);
    }

    .number {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--yellow);
      font-size: .75rem;
      font-weight: 900;
      background: rgba(255,209,102,.1);
      border: 1px solid rgba(255,209,102,.2);
    }

    .think {
      margin-top: auto;
      padding-top: 22px;
      color: var(--muted);
      font-size: .78rem;
    }

    .think kbd {
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-bottom-color: rgba(255,255,255,.25);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,.06);
      font-family: inherit;
    }

    .answer-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, rgba(94,231,223,.055), rgba(155,140,255,.04));
    }

    .answer-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .answer-heading h2 {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.65rem);
      letter-spacing: -.025em;
    }

    .answer-badge {
      padding: 6px 10px;
      border-radius: 99px;
      color: var(--green);
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      background: rgba(124,231,172,.08);
      border: 1px solid rgba(124,231,172,.18);
    }

    .answers { display: grid; gap: 13px; }

    .answers li {
      display: none;
      padding: 13px 15px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      color: #e7e9f7;
      font-size: clamp(.84rem, 1.12vw, .96rem);
      line-height: 1.45;
      background: rgba(255,255,255,.035);
    }

    .answers li.visible {
      display: block;
      animation: answer-in .28s ease both;
    }

    @keyframes answer-in {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: none; }
    }

    .answers strong { color: var(--cyan); }
    code { color: #e4dcff; font-family: "SFMono-Regular", Consolas, monospace; font-size: .91em; }

    .answer-content {
      opacity: 0;
      transform: translateY(8px);
      filter: blur(5px);
      pointer-events: none;
      transition: opacity .28s ease, transform .28s ease, filter .28s ease;
    }

    .revealed .answer-content {
      opacity: 1;
      transform: none;
      filter: none;
      pointer-events: auto;
    }

    .reveal-cover {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
      transition: opacity .22s ease, transform .22s ease;
    }

    .revealed .reveal-cover { opacity: 0; transform: scale(.98); pointer-events: none; }

    .reveal-inner { max-width: 340px; }
    .reveal-icon { display: block; margin-bottom: 14px; font-size: 2.3rem; }
    .reveal-inner strong { display: block; margin-bottom: 7px; font-size: 1.25rem; }
    .reveal-inner p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }

    .primary, .nav-button {
      border: 0;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .primary:hover, .nav-button:hover:not(:disabled) { transform: translateY(-2px); }
    .primary:focus-visible, .nav-button:focus-visible, .dot:focus-visible { outline: 3px solid rgba(94,231,223,.45); outline-offset: 3px; }

    .primary {
      padding: 12px 18px;
      border-radius: 12px;
      color: #0b0d19;
      font-weight: 900;
      background: linear-gradient(135deg, var(--cyan), #a7fff4);
      box-shadow: 0 10px 28px rgba(94,231,223,.16);
    }

    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
    }

    .dots { display: flex; align-items: center; justify-content: center; gap: 7px; }

    .dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 99px;
      cursor: pointer;
      background: rgba(255,255,255,.2);
      transition: width .22s ease, background .22s ease;
    }

    .dot.active { width: 28px; background: linear-gradient(90deg, var(--purple), var(--cyan)); }
    .nav-group { display: flex; gap: 9px; }
    .nav-group:last-child { justify-content: end; }

    .nav-button {
      min-width: 100px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--ink);
      background: rgba(255,255,255,.045);
    }

    .nav-button.next { border-color: rgba(155,140,255,.28); background: rgba(155,140,255,.1); }
    .nav-button:disabled { opacity: .3; cursor: not-allowed; }

    @media (max-width: 820px) {
      .app { width: min(100% - 20px, 680px); padding: 14px 0; }
      .top-meta .progress-track { display: none; }
      .slide { grid-template-columns: 1fr; min-height: auto; border-radius: 22px; }
      .question-panel { border-right: 0; border-bottom: 1px solid var(--line); }
      .question-panel, .answer-panel { padding: 28px 24px; }
      .answer-panel { min-height: 380px; }
      h1 { max-width: none; }
      footer { grid-template-columns: 1fr 1fr; }
      .dots { grid-column: 1 / -1; grid-row: 1; }
    }

    @media (max-width: 500px) {
      .brand-copy span { display: none; }
      .question-panel, .answer-panel { padding: 24px 18px; }
      .questions li { grid-template-columns: 26px 1fr; gap: 9px; }
      .number { width: 25px; height: 25px; }
      .nav-button { min-width: 0; width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    @media print {
      body { color: #111; background: #fff; }
      body::before, header, footer, .reveal-cover { display: none !important; }
      .app { width: 100%; display: block; padding: 0; }
      .slide { min-height: 0; display: block; border: 0; box-shadow: none; background: #fff; }
      .question-panel, .answer-panel { color: #111; border: 0; padding: 24px; background: #fff; }
      .answer-content { opacity: 1; transform: none; filter: none; }
      .prompt, .think { color: #444; }
      .questions li, .answers li { color: #111; }
      .answers li { display: block; border-color: #ccc; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">FM</div>
        <div class="brand-copy">
          <strong>Fashion-MNIST</strong>
          <span>From notebook to maintainable ML</span>
        </div>
      </div>
      <div class="top-meta">
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>
        <div class="counter" id="counter" aria-live="polite">1 / 9</div>
      </div>
    </header>

    <main>
      <article class="slide" id="slide" aria-labelledby="topic-title">
        <section class="question-panel">
          <div class="eyebrow" id="eyebrow">Learning check 1</div>
          <h1 id="topic-title"></h1>
          <p class="prompt" id="prompt"></p>
          <ol class="questions" id="questions"></ol>
          <div class="think">Discuss first · then press <kbd>Space</kbd> or reveal the answer</div>
        </section>

        <section class="answer-panel" id="answer-panel" aria-live="polite">
          <div class="answer-content" id="answer-content">
            <div class="answer-heading">
              <h2>Review answer</h2>
              <span class="answer-badge" id="answer-count">Key ideas</span>
            </div>
            <ul class="answers" id="answers"></ul>
          </div>
          <div class="reveal-cover">
            <div class="reveal-inner">
              <span class="reveal-icon" aria-hidden="true">✦</span>
              <strong>Ready to compare?</strong>
              <p>Invite one or two answers from the room before revealing the key ideas.</p>
              <button class="primary" id="reveal" type="button">Reveal answer</button>
            </div>
          </div>
        </section>
      </article>
    </main>

    <footer>
      <div class="nav-group">
        <button class="nav-button" id="previous" type="button" aria-label="Previous question">← Previous</button>
      </div>
      <nav class="dots" id="dots" aria-label="Choose a learning check"></nav>
      <div class="nav-group">
        <button class="nav-button next" id="next" type="button" aria-label="Next question">Next →</button>
      </div>
    </footer>
  </div>

  <script>
    const slides = [
      {
        title: "Data roles & versioning",
        prompt: "A trustworthy model begins with a trustworthy experimental boundary.",
        questions: [
          "What are the distinct jobs of training, validation, and test data?",
          "What shapes and dtypes do we expect before preprocessing?",
          "What should DVC record so another team can reproduce the run?"
        ],
        answers: [
          "<strong>Roles:</strong> training data fits the weights; validation data guides architecture, settings, and stopping; test data gives one final estimate on unseen examples. Reusing the test set for decisions makes that estimate optimistically biased.",
          "<strong>Shapes:</strong> images are <code>(60000, 28, 28)</code> and <code>(10000, 28, 28)</code>: examples × height × width. Raw pixels are <code>uint8</code>; labels are one-dimensional integer arrays.",
          "<strong>Version:</strong> preserve the exact data artifact/hash, source, split, preparation code, preprocessing, and class map. Git tracks code and DVC pointers; DVC storage holds the large data."
        ]
      },
      {
        title: "Validate before training",
        prompt: "Fail early when the input contract is broken—before wasting an experiment.",
        questions: [
          "Which data assertions should stop the pipeline?",
          "How would you check whether the ten classes are balanced?"
        ],
        answers: [
          "<strong>Assert:</strong> require matching image/label counts, 28×28 shape, numeric finite pixels, the expected value range, and labels 0–9. These checks turn silent data corruption into an immediate, understandable failure.",
          "<strong>Balance:</strong> compare <code>np.bincount(..., minlength=10)</code> for both splits and inspect class proportions. Balanced totals do not remove the need for per-class evaluation later."
        ]
      },
      {
        title: "Preprocessing is a contract",
        prompt: "Training and serving must agree on what one pixel value means.",
        questions: [
          "What range results from dividing pixels by 255?",
          "Why must train, test, and deployed inputs use the same transformation?",
          "What goes wrong with double scaling or test-fitted statistics?"
        ],
        answers: [
          "<strong>Range:</strong> dividing by <code>255.0</code> maps <code>[0, 255]</code> to <code>[0, 1]</code> and converts the values to floating point. Verify the result with <code>min()</code>, <code>max()</code>, and <code>dtype</code>.",
          "<strong>Consistency:</strong> the model learns weights for one numerical distribution. Test and deployed images must follow the identical transformation, or the meaning of each input value changes.",
          "<strong>Failure:</strong> double scaling shrinks training values to <code>[0, 1/255]</code>; test-fitted statistics leak evaluation information. Package preprocessing with the model so serving cannot improvise it."
        ]
      },
      {
        title: "From pixels to logits",
        prompt: "Trace the representation through the network before counting predictions.",
        questions: [
          "What is the shape after each layer?",
          "What does Flatten preserve—and what useful structure does it not exploit?",
          "Why are there ten outputs, and do they already sum to one?",
          "Which layer type better captures local visual patterns?"
        ],
        answers: [
          "<strong>Shapes:</strong> <code>(28,28) → 784 → 128 → 10</code>, with the batch dimension carried through every stage. The final ten values correspond to the ten named classes.",
          "<strong>Flatten:</strong> keeps every pixel and its fixed ordering, but gives the dense layer no built-in knowledge that nearby pixels are related. That spatial relationship must be learned indirectly.",
          "<strong>Output:</strong> there is one unrestricted logit per class, so the values need not be positive or sum to 1. <code>from_logits=True</code> lets the loss apply softmax in a numerically stable way.",
          "<strong>Extension:</strong> convolutional layers reuse small filters across locations and preserve spatial structure. This is a useful inductive bias for edges, textures, and clothing shapes."
        ]
      },
      {
        title: "Loss, metric & configuration",
        prompt: "Separate what the model optimizes from what humans use to judge it.",
        questions: [
          "Why sparse categorical cross-entropy?",
          "Why optimize loss instead of accuracy?",
          "Which notebook values belong in configuration?",
          "What evidence should choose the number of epochs?"
        ],
        answers: [
          "<strong>Loss:</strong> sparse categorical cross-entropy matches one integer label among ten mutually exclusive classes. Ordinary categorical cross-entropy would instead expect a ten-value one-hot label.",
          "<strong>Optimization:</strong> accuracy is intuitive but changes only when the winning class changes, so it supplies poor gradients. Cross-entropy rewards movement toward the correct class even before the prediction flips.",
          "<strong>Config:</strong> expose epochs, batch size, hidden units, optimizer/learning rate, seed, validation split, paths, and debug mode. Keeping these outside the training logic makes experiments easier to compare.",
          "<strong>Evidence:</strong> choose the epoch near minimum validation loss—not maximum test accuracy. Early stopping can save and restore that best validation checkpoint automatically."
        ]
      },
      {
        title: "Track the experiment",
        prompt: "A result without its context is a number, not a reproducible experiment.",
        questions: [
          "What is validation data for?",
          "Which TensorBoard curves diagnose underfitting or overfitting?",
          "What must accompany saved weights?",
          "What changes because Colab storage is temporary?"
        ],
        answers: [
          "<strong>Validation:</strong> use a held-out part of the training data to choose settings and stopping points without consuming the test set. The test set remains reserved for the final model.",
          "<strong>Curves:</strong> compare training and validation loss and accuracy over epochs. Poor results on both suggest underfitting; improving training with worsening validation suggests overfitting.",
          "<strong>Record:</strong> save the Git commit, DVC data version, resolved configuration, environment, seeds, metrics, logs, and exact checkpoint. A result is reproducible only when its context is reproducible.",
          "<strong>Colab:</strong> its local runtime can disappear, so copy valuable artifacts to Drive, object storage, or a DVC remote. Keep large datasets, checkpoints, and generated logs out of Git."
        ]
      },
      {
        title: "Generalization, fairly measured",
        prompt: "The saved run gives us a concrete gap—but the gap needs interpretation.",
        questions: [
          "What is the observed training–test accuracy gap?",
          "Is the gap alone enough to prove overfitting?",
          "Why is choosing the best of 20 models on the test set biased?"
        ],
        answers: [
          "<strong>Gap:</strong> <code>89.17% − 87.25% = 1.92</code> percentage points for the saved run. A fresh run can differ slightly because initialization and training are stochastic.",
          "<strong>Diagnosis:</strong> the gap alone does not prove overfitting. Inspect validation curves, repeated runs, a simple baseline, distribution shift, and class-level errors to explain it.",
          "<strong>Fairness:</strong> choosing the best of many models on test accuracy adapts to random quirks in that test set. Select on validation data, freeze all decisions, and test once at the end."
        ]
      },
      {
        title: "Confidence & error analysis",
        prompt: "A wrong answer can still arrive with a very confident softmax score.",
        questions: [
          "Which classes does the model confuse, and is the confusion plausible?",
          "Does the largest softmax value prove calibration?",
          "What do a confusion matrix and per-class recall add?",
          "What should happen before changing the architecture?"
        ],
        answers: [
          "<strong>Common confusion:</strong> Shirt ↔ T-shirt/top is visually plausible at 28×28 resolution. Still, cite an actual index from the current run and compare its true label, prediction, and leading scores.",
          "<strong>Confidence:</strong> no—softmax only normalizes the model's scores and can be sharp even when wrong. Calibration needs held-out measurement, such as a reliability diagram.",
          "<strong>Class metrics:</strong> a confusion matrix reveals which pairs are mixed up; per-class recall reveals which true classes are missed. Overall accuracy averages these patterns away.",
          "<strong>Diagnose first:</strong> inspect examples, label quality, balance, and error patterns before changing the model. The diagnosis should determine whether to clean data, collect examples, or alter the architecture."
        ]
      },
      {
        title: "From notebook to production",
        prompt: "Turn a successful exploration into a testable, traceable, reversible system.",
        questions: [
          "How should config, reusable functions, training, and the entry point be separated?",
          "What belongs in Git, DVC, and experiment storage?",
          "What should CI verify before merge?",
          "What is the deployment input/output contract?",
          "How should promotion and rollback work?"
        ],
        answers: [
          "<strong>Structure:</strong> configuration holds validated settings; train/eval functions contain reusable work; a small entry point parses arguments and orchestrates one run. Importing a module should not start training.",
          "<strong>Versioning:</strong> use Git for code and small metadata, DVC for data and large artifacts, and run storage for logs/checkpoints. Link everything with one experiment ID.",
          "<strong>CI:</strong> run linting, unit tests, configuration checks, and a tiny training smoke test before merge. Full-data experiments are slower and should run separately on suitable compute.",
          "<strong>Contract:</strong> require a grayscale 28×28 image, known dtype/range, exact preprocessing, batch shape, and fixed class order. Reject malformed input clearly instead of guessing.",
          "<strong>Release:</strong> define overall and per-class acceptance criteria before evaluation. Deploy immutable model versions, monitor them, and keep the previous approved version available for one-step rollback."
        ]
      }
    ];

    const els = {
      slide: document.querySelector('#slide'),
      eyebrow: document.querySelector('#eyebrow'),
      title: document.querySelector('#topic-title'),
      prompt: document.querySelector('#prompt'),
      questions: document.querySelector('#questions'),
      answers: document.querySelector('#answers'),
      answerPanel: document.querySelector('#answer-panel'),
      answerCount: document.querySelector('#answer-count'),
      reveal: document.querySelector('#reveal'),
      previous: document.querySelector('#previous'),
      next: document.querySelector('#next'),
      counter: document.querySelector('#counter'),
      progress: document.querySelector('#progress'),
      dots: document.querySelector('#dots')
    };

    let current = 0;
    let revealedCount = 0;

    function buildDots() {
      slides.forEach((slide, index) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'dot';
        dot.setAttribute('aria-label', `Go to learning check ${index + 1}: ${slide.title}`);
        dot.addEventListener('click', () => show(index));
        els.dots.appendChild(dot);
      });
    }

    function show(index) {
      current = Math.max(0, Math.min(index, slides.length - 1));
      revealedCount = 0;
      const data = slides[current];

      els.slide.style.animation = 'none';
      void els.slide.offsetWidth;
      els.slide.style.animation = '';
      els.slide.classList.remove('revealed');
      els.eyebrow.textContent = current === slides.length - 1 ? 'Final learning check' : `Learning check ${current + 1}`;
      els.title.textContent = data.title;
      els.prompt.textContent = data.prompt;
      els.questions.innerHTML = data.questions.map((question, i) =>
        `<li><span class="number">${i + 1}</span><span>${question}</span></li>`
      ).join('');
      els.answers.innerHTML = data.answers.map(answer => `<li>${answer}</li>`).join('');
      els.counter.textContent = `${current + 1} / ${slides.length}`;
      els.progress.style.width = `${((current + 1) / slides.length) * 100}%`;
      els.previous.disabled = current === 0;
      updateAnswerState();

      [...els.dots.children].forEach((dot, i) => {
        dot.classList.toggle('active', i === current);
        dot.setAttribute('aria-current', i === current ? 'step' : 'false');
      });
    }

    function updateAnswerState() {
      const total = slides[current].answers.length;
      const answerItems = [...els.answers.children];
      els.slide.classList.toggle('revealed', revealedCount > 0);
      answerItems.forEach((item, index) => item.classList.toggle('visible', index < revealedCount));
      els.answerCount.textContent = revealedCount > 0 ? `${revealedCount} of ${total}` : 'Key ideas';

      if (revealedCount < total) {
        els.next.textContent = revealedCount === 0 ? 'Reveal answer →' : 'Reveal next →';
        els.next.setAttribute('aria-label', `Reveal answer ${revealedCount + 1} of ${total}`);
      } else if (current === slides.length - 1) {
        els.next.textContent = 'Start over ↺';
        els.next.setAttribute('aria-label', 'Return to the first question');
      } else {
        els.next.textContent = 'Next →';
        els.next.setAttribute('aria-label', 'Next question');
      }
    }

    function revealNext() {
      const total = slides[current].answers.length;
      if (revealedCount < total) {
        revealedCount += 1;
        updateAnswerState();
      }
    }

    function stepForward() {
      if (revealedCount < slides[current].answers.length) return revealNext();
      show(current === slides.length - 1 ? 0 : current + 1);
    }

    function previous() {
      if (current > 0) show(current - 1);
    }

    els.reveal.addEventListener('click', revealNext);
    els.next.addEventListener('click', stepForward);
    els.previous.addEventListener('click', previous);

    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight' || event.key === 'PageDown') stepForward();
      if (event.key === 'ArrowLeft' || event.key === 'PageUp') previous();
      if (event.key === ' ' && !['INPUT', 'TEXTAREA'].includes(event.target.tagName)) {
        event.preventDefault();
        stepForward();
      }
      if (event.key.toLowerCase() === 'r') revealNext();
      if (event.key === 'Home') show(0);
      if (event.key === 'End') show(slides.length - 1);
    });

    buildDots();
    show(0);
  </script>
</body>
</html>
