<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Fashion-MNIST · Class Review</title>
  <style>
    :root {
      --ink: #f8f7ff;
      --muted: #b9bdd1;
      --panel: rgba(20, 23, 42, 0.82);
      --panel-strong: #171a31;
      --line: rgba(255, 255, 255, 0.12);
      --purple: #9b8cff;
      --cyan: #5ee7df;
      --yellow: #ffd166;
      --green: #7ce7ac;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 8%, rgba(155, 140, 255, 0.22), transparent 34rem),
        radial-gradient(circle at 90% 90%, rgba(94, 231, 223, 0.16), transparent 36rem),
        #0b0d19;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    button { font: inherit; }

    .app {
      width: 90vw;
      min-height: 100vh;
      margin: auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 20px;
      padding: 24px 0;
      position: relative;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: #0b0d19;
      font-weight: 900;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      box-shadow: 0 10px 30px rgba(94, 231, 223, 0.2);
    }

    .brand-copy strong { display: block; font-size: 0.98rem; letter-spacing: .01em; }
    .brand-copy span { color: var(--muted); font-size: 0.78rem; }

    .top-meta { display: flex; align-items: center; gap: 14px; color: var(--muted); }

    .counter {
      min-width: 74px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      text-align: center;
      font-size: .83rem;
      background: rgba(255,255,255,.04);
    }

    .progress-track {
      width: min(260px, 25vw);
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.09);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      transition: width .35s ease;
    }

    main { display: grid; place-items: center; min-height: 0; }

    .slide {
      width: 100%;
      min-height: min(720px, calc(100vh - 180px));
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .question-panel, .answer-panel { padding: clamp(28px, 4.5vw, 58px); }

    .question-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background:
        radial-gradient(circle at 10% 0%, rgba(155,140,255,.16), transparent 48%),
        rgba(255,255,255,.015);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      color: var(--cyan);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 18px currentColor;
    }

    h1 {
      max-width: 16ch;
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 4rem);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .prompt {
      max-width: 55ch;
      margin: 0 0 26px;
      color: var(--muted);
      font-size: clamp(.92rem, 1.4vw, 1.08rem);
      line-height: 1.55;
    }

    .questions, .answers { margin: 0; padding: 0; list-style: none; }

    .questions { display: block; }
    .questions li { display: block; }
    .questions .number { display: none; }
    .questions p { margin: 0 0 12px; }
    .questions ul { margin: 8px 0 8px 1.25em; padding: 0; }
    .questions li li { display: list-item; margin: 5px 0; }

    .questions li {
      display: block;
      align-items: start;
      color: #eaebf5;
      line-height: 1.45;
      font-size: clamp(.9rem, 1.25vw, 1.03rem);
    }

    .number {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--yellow);
      font-size: .75rem;
      font-weight: 900;
      background: rgba(255,209,102,.1);
      border: 1px solid rgba(255,209,102,.2);
    }

    .think {
      margin-top: auto;
      padding-top: 22px;
      color: var(--muted);
      font-size: .78rem;
    }

    .think kbd {
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-bottom-color: rgba(255,255,255,.25);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,.06);
      font-family: inherit;
    }

    .answer-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, rgba(94,231,223,.055), rgba(155,140,255,.04));
    }

    .answer-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .answer-heading h2 {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.65rem);
      letter-spacing: -.025em;
    }

    .answer-badge {
      padding: 6px 10px;
      border-radius: 99px;
      color: var(--green);
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      background: rgba(124,231,172,.08);
      border: 1px solid rgba(124,231,172,.18);
    }

    .answers {
      display: grid;
      align-content: start;
      gap: 13px;
      height: min(60vh, 520px);
      overflow-y: auto;
      scrollbar-gutter: stable;
      padding-right: 5px;
    }

    .answers > li {
      display: block;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
      padding: 13px 15px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      color: #e7e9f7;
      font-size: clamp(.84rem, 1.12vw, .96rem);
      line-height: 1.45;
      background: rgba(255,255,255,.035);
    }

    .answers > li.visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .answers strong { color: var(--cyan); }
    .answers p { margin: 0 0 10px; }
    .answers ul { margin: 6px 0 10px 1.2em; padding: 0; }
    .answers li li { display: list-item; margin: 4px 0; }
    .answers .equation { margin: 8px 0; text-align: center; font-size: 1.05rem; }
    code { color: #e4dcff; font-family: "SFMono-Regular", Consolas, monospace; font-size: .91em; }
    pre { overflow-x: auto; margin: 0; padding: 14px; border: 1px solid rgba(255,255,255,.09); border-radius: 10px; background: rgba(0,0,0,.24); }
    pre code { color: #dce4ff; white-space: pre; }

    .answer-content {
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .revealed .answer-content {
      opacity: 1;
      pointer-events: auto;
    }

    .reveal-cover {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
      transition: opacity .18s ease;
    }

    .revealed .reveal-cover { opacity: 0; pointer-events: none; }

    .reveal-inner { max-width: 340px; }
    .reveal-icon { display: block; margin-bottom: 14px; font-size: 2.3rem; }
    .reveal-inner strong { display: block; margin-bottom: 7px; font-size: 1.25rem; }
    .reveal-inner p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }

    .primary, .nav-button {
      border: 0;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .primary:hover, .nav-button:hover:not(:disabled) { transform: translateY(-2px); }
    .primary:focus-visible, .nav-button:focus-visible, .dot:focus-visible { outline: 3px solid rgba(94,231,223,.45); outline-offset: 3px; }

    .primary {
      padding: 12px 18px;
      border-radius: 12px;
      color: #0b0d19;
      font-weight: 900;
      background: linear-gradient(135deg, var(--cyan), #a7fff4);
      box-shadow: 0 10px 28px rgba(94,231,223,.16);
    }

    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
    }

    .dots { display: flex; align-items: center; justify-content: center; gap: 7px; }

    .dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 99px;
      cursor: pointer;
      background: rgba(255,255,255,.2);
      transition: width .22s ease, background .22s ease;
    }

    .dot.active { width: 28px; background: linear-gradient(90deg, var(--purple), var(--cyan)); }
    .nav-group { display: flex; gap: 9px; }
    .nav-group:last-child { justify-content: end; }

    .nav-button {
      min-width: 100px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--ink);
      background: rgba(255,255,255,.045);
    }

    .nav-button.next { border-color: rgba(155,140,255,.28); background: rgba(155,140,255,.1); }
    .nav-button:disabled { opacity: .3; cursor: not-allowed; }

    @media (max-width: 820px) {
      .app { width: 90vw; padding: 14px 0; }
      .top-meta .progress-track { display: none; }
      .slide { grid-template-columns: 1fr; min-height: auto; border-radius: 22px; }
      .question-panel { border-right: 0; border-bottom: 1px solid var(--line); }
      .question-panel, .answer-panel { padding: 28px 24px; }
      .answer-panel { min-height: 380px; }
      h1 { max-width: none; }
      footer { grid-template-columns: 1fr 1fr; }
      .dots { grid-column: 1 / -1; grid-row: 1; }
    }

    @media (max-width: 500px) {
      .brand-copy span { display: none; }
      .question-panel, .answer-panel { padding: 24px 18px; }
      .questions li { grid-template-columns: 26px 1fr; gap: 9px; }
      .number { width: 25px; height: 25px; }
      .nav-button { min-width: 0; width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    @media print {
      body { color: #111; background: #fff; }
      body::before, header, footer, .reveal-cover { display: none !important; }
      .app { width: 100%; display: block; padding: 0; }
      .slide { min-height: 0; display: block; border: 0; box-shadow: none; background: #fff; }
      .question-panel, .answer-panel { color: #111; border: 0; padding: 24px; background: #fff; }
      .answer-content { opacity: 1; transform: none; filter: none; }
      .prompt, .think { color: #444; }
      .questions li, .answers li { color: #111; }
      .answers { height: auto; overflow: visible; }
      .answers li { display: block; visibility: visible; opacity: 1; border-color: #ccc; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">FM</div>
        <div class="brand-copy">
          <strong>Fashion-MNIST</strong>
          <span>From notebook to maintainable ML</span>
        </div>
      </div>
      <div class="top-meta">
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>
        <div class="counter" id="counter" aria-live="polite">1 / 9</div>
      </div>
    </header>

    <main>
      <article class="slide" id="slide" aria-labelledby="topic-title">
        <section class="question-panel">
          <div class="eyebrow" id="eyebrow">Learning check 1</div>
          <h1 id="topic-title"></h1>
          <p class="prompt" id="prompt"></p>
          <ol class="questions" id="questions"></ol>
          <div class="think">Discuss first · then press <kbd>Space</kbd> or reveal the answer</div>
        </section>

        <section class="answer-panel" id="answer-panel" aria-live="polite">
          <div class="answer-content" id="answer-content">
            <div class="answer-heading">
              <h2>Review answer</h2>
              <span class="answer-badge" id="answer-count">Key ideas</span>
            </div>
            <ul class="answers" id="answers"></ul>
          </div>
          <div class="reveal-cover">
            <div class="reveal-inner">
              <span class="reveal-icon" aria-hidden="true">✦</span>
              <strong>Ready to compare?</strong>
              <p>Invite one or two answers from the room before revealing the key ideas.</p>
              <button class="primary" id="reveal" type="button">Reveal answer</button>
            </div>
          </div>
        </section>
      </article>
    </main>

    <footer>
      <div class="nav-group">
        <button class="nav-button" id="previous" type="button" aria-label="Previous question">← Previous</button>
      </div>
      <nav class="dots" id="dots" aria-label="Choose a learning check"></nav>
      <div class="nav-group">
        <button class="nav-button next" id="next" type="button" aria-label="Next question">Next →</button>
      </div>
    </footer>
  </div>

  <script>
    const slides = [
      {
            "title": "Reproducible environments",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>Why should you record the TensorFlow version and random seed when comparing two training runs? Answer in at most two sentences.</p>"
            ],
            "answers": [
                  "<p>The version of Tensorflow (and other libraries in general) affects the implementations for functions and default settings, etc. The seed you set controls random choices in the code flow, such as initialization and shuffling of the data. Recording both improves reproducibility, although hardware and nondeterministic operations may still produce different results.</p>"
            ]
      },
      {
            "title": "An untouched test set",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>Why should hyperparameters be chosen using validation data rather than the test set? Answer in at most two sentences.</p>"
            ],
            "answers": [
                  "<p>Repeatedly choosing settings using the performance on the test set adapts development to that particular set. Validation data guides these decisions while an untouched test set provides a more independent final evaluation of the model's performance.</p>"
            ]
      },
      {
            "title": "Check the input contract",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>How would you first print the training-image shape and dtype, and then assert that every image is both 28 by 28 and has one label? Write a short code cell.</p>"
            ],
            "answers": [
                  "<p>These assertions catch incompatible inputs before training.</p>",
                  "<pre><code>print(train_images.shape, train_images.dtype) # (60000, 28, 28) uint8\nassert train_images.shape[1:] == (28, 28) # Check that each image is 28x28\nassert len(train_images) == len(train_labels) # Check that the number of images matches the number of labels\nassert train_labels.shape == (len(train_images),) # Check that the labels are 1-dim arrays with one label per image\nassert np.issubdtype(train_labels.dtype, np.integer) # Check that the labels are integers\nassert np.all((train_labels &gt;= 0) &amp; (train_labels &lt; 10)) # Check that the labels are in the range [0, 10)</code></pre>"
            ]
      },
      {
            "title": "Proper reproducability",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>Why does committing training code and configuration to Git alone fail to reproduce an experiment? Answer in at most two sentences.</p>"
            ],
            "answers": [
                  "<p>The same code trained on a different dataset can learn different weights and this can produce different evaluation metrics. Therefore, it's important to track the exact dataset and how it was split, too. To achieve this, we can use tools like DVC (Data Version Control) that allow us to version the dataset and track changes in the data. Git can store DVC pointers while a DVC remote stores the large artifacts. This prevents large datasets from being stored in Git while still allowing for reproducibility of experiments.</p>"
            ]
      },
      {
            "title": "Scale pixel values",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>Why divide pixels by 255 before training and apply the same division at deployment? Answer in at most two sentences.</p>"
            ],
            "answers": [
                  "<p>Scaling puts the input features on a smaller, consistent numerical range that usually makes optimization easier. This way, there are no features with a much larger scale than others, which can make optimization difficult.</p><p>During deployment, we must use the same scale because the weights were learned for that particular input representation.</p>"
            ]
      },
      {
            "title": "Reusable preprocessing",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>How would you implement <code>normalize_pixels(raw_images)</code> to return <code>float32</code> pixels in <code>[0, 1]</code>, then demonstrate it on a freshly loaded raw image?</p>"
            ],
            "answers": [
                  "<p>Call this function only on raw pixels; reuse it in training and serving.</p>",
                  "<pre><code>def normalize_pixels(raw_images):\n    assert np.all((raw_images &gt;= 0) &amp; (raw_images &lt;= 255)), \"Input images must be in the range [0, 255].\"\n    return np.asarray(raw_images, dtype=np.float32) / 255.0\n\n(raw_train_images, _), _ = fashion_mnist.load_data()\nnormalized_example = normalize_pixels(raw_train_images[:1])</code></pre>"
            ]
      },
      {
            "title": "Inspect class balance",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>How would you count training examples in each class and display a (labeled) bar chart using NumPy and Matplotlib?</p>"
            ],
            "answers": [
                  "<p>The use of class counts reveals imbalances that the image grid above may miss.</p>",
                  "<pre><code>class_counts = np.bincount(train_labels, minlength=len(class_names))\nplt.figure(figsize=(10, 3))\nplt.bar(class_names, class_counts) # use class_names as x-ticks and class_counts as heights\nplt.xticks(rotation=45, ha='right')\nplt.ylabel('Training examples')\nplt.tight_layout()\nplt.show()</code></pre>"
            ]
      },
      {
            "title": "Flatten and spatial structure",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>Why does <code>Flatten</code> make a dense network easy to build, yet provide less useful structure for images than convolutional layers? Answer in at most two sentences.</p>"
            ],
            "answers": [
                  "<p><code>Flatten</code> creates a 1-D vector preserving each pixel and its positional order. Convolutions explicitly use local neighborhoods and shared filters. Dense layers must learn spatial relationships without that structural information.</p>"
            ]
      },
      {
            "title": "Count trainable parameters",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>How would you inspect the model summary and total parameter count, then verify the count from the two dense layers? Include biases in your calculation.</p>"
            ],
            "answers": [
                  "<p>Flatten has no parameters; a dense layer has one weight per input-output connection and one bias per output.</p>",
                  "<pre><code>model.summary()\nexpected_parameters = (28 * 28 + 1) * 128 + (128 + 1) * 10\n# reasoning: (input features + bias) * units in first layer + (units in first layer + bias) * units in second layer\nprint('Expected:', expected_parameters)\nprint('Actual:', model.count_params())\nassert model.count_params() == expected_parameters  # 101,770</code></pre>"
            ]
      },
      {
            "title": "Match loss to outputs",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>Why is <code>SparseCategoricalCrossentropy(from_logits=True)</code> an appropriate loss function for our model, and how is the loss calculated for an example label <code>2</code>?</p>"
            ],
            "answers": [
                  "<p>First, we supply integer labels, and <code>SparseCategoricalCrossentropy</code> accepts integer labels rather than <code>CategoricalCrossentropy</code> which accepts a one-hot encoded vector.</p><p>Second, because the network was not configured with a softmax activation as the final layer, it emits logits; applying <code>from_logits=True</code> then applies softmax for us, and converts the output vector into a categorial distribution (sums to 1) for the loss calculation.</p><p>We can calculate the loss for example label <code>2</code> as follows:</p><p>Taking <code>[z_0, ..., z_N]</code> to represent the output logits vector, softmax gives the probability for class <code>i</code>:</p><p><div class=\"equation\"><code>p_i = exp(z_i) / sum(exp(z_j))</code></div></p><p>If the correct label is class <code>2</code>, the loss for that image is:</p><p><div class=\"equation\"><code>L = -log(p_2)</code></div></p>"
            ]
      },
      {
            "title": "Validation and TensorBoard",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>How would you rewrite the upcoming <code>model.fit</code> call to:<br>- reserve 20% of training data for validation,<br>- save the history,<br>- add a TensorBoard callback,<br>- and use configuration values for epochs and batch size. </p><p>The runnable answer below performs this training step; the following tutorial code cell saves the weights.</p>"
            ],
            "answers": [
                  "<p>Validation examples are held out from weight updates. Use a distinct log directory per experiment; project run IDs can include the Git commit.</p>",
                  "<pre><code>config = {'epochs': 5, 'batch_size': 32}\ntensorboard = tf.keras.callbacks.TensorBoard(log_dir='logs/fit/run_01')\nhistory = model.fit(\n    train_images, train_labels,\n    epochs=config['epochs'],\n    batch_size=config['batch_size'],\n    validation_split=0.2,\n    callbacks=[tensorboard],\n)</code></pre>"
            ]
      },
      {
            "title": "Weights are only one artifact",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>Why are saved weights alone insufficient to reproduce or deploy this experiment? Provide a list of other artifacts that are needed to reproduce or deploy the model.</p>"
            ],
            "answers": [
                  "<p>Besides weights, we need:<br>- the matching architecture<br>- preprocessing<br>- the class order<br>- code library versions<br>- data versions<br>- configuration<br>- environment details</p>"
            ]
      },
      {
            "title": "Measure the accuracy gap",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>How would you evaluate the final model on the training data and calculate training-to-test accuracy improvement in percentage points? Use the existing test_acc.</p>"
            ],
            "answers": [
                  "<p>Evaluate the final weights on both sets for a direct comparison; the last epoch's training metric mixes predictions made while weights were changing.</p>",
                  "<pre><code>_, final_train_acc = model.evaluate(train_images, train_labels, verbose=0)\ngap_percentage_points = 100 * (final_train_acc - test_acc)\nprint(f'Final-model accuracy gap: {gap_percentage_points:.2f} percentage points')</code></pre>"
            ]
      },
      {
            "title": "Interpret generalization",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>Why is a training-test accuracy gap alone insufficient proof of overfitting? Answer in at most two sentences.</p>"
            ],
            "answers": [
                  "<p>A train\u2013test gap alone doesn\u2019t show that the model memorized its training data; finite samples can differ in difficulty. Compare training and validation performance over epochs: training performance improving while validation performance worsens is stronger evidence of overfitting.</p>"
            ]
      },
      {
            "title": "Softmax for interpretation",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>Why add softmax for predictions when the training model already outputs ten logits? Answer in at most two sentences.</p>"
            ],
            "answers": [
                  "<p>Softmax converts unrestricted scores into nonnegative values that sum to one, making them easier to interpret. It preserves the winning class, so it is useful for reporting confidence but unnecessary for finding the largest score.</p>"
            ]
      },
      {
            "title": "Report a prediction",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>How would you print the predicted class name, its softmax score, and the true class name for test image 0 using <code>predictions</code> and <code>class_names</code>?</p>"
            ],
            "answers": [
                  "<p>The index that attains the largest score must be mapped to the class-name list.</p>",
                  "<pre><code>image_index = 0\npredicted_class = int(np.argmax(predictions[image_index])) # Get the index of the class with the highest predicted probability\nscore = predictions[image_index, predicted_class] # Get the predicted probability for the predicted class\ntrue_class = int(test_labels[image_index]) # Get the true class label for the image\nprint(f'Predicted: {class_names[predicted_class]} ({score:.1%})')\nprint(f'True: {class_names[true_class]}')</code></pre>"
            ]
      },
      {
            "title": "Find a real mistake",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>How would you find the first incorrectly classified test image and show it using <code>plot_image</code>? Make it robust, i.e., also handle the case where no mistakes exist.</p>"
            ],
            "answers": [
                  "<p>Find an error from the current predictions. Note that a hard-coded example can be correct in another run.</p>",
                  "<pre><code>predicted_labels = np.argmax(predictions, axis=1)\nwrong_indices = np.flatnonzero(predicted_labels != test_labels) \n # Return the indices of the test set where the predicted labels do not match the true labels\nif wrong_indices.size:\n    mistake_index = int(wrong_indices[0])\n    plt.figure(figsize=(4, 4))\n    plot_image(mistake_index, predictions[mistake_index], test_labels, test_images)\n    plt.show()\nelse:\n    print('No mistakes found in this test set.')</code></pre>"
            ]
      },
      {
            "title": "Confident errors",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>Why can an incorrect prediction still have a very high softmax score? Answer in at most two sentences.</p>"
            ],
            "answers": [
                  "<p>Softmax reports relative preference among available classes. Ambiguous or unfamiliar inputs can produce extreme scores, therefore, calibration must be assessed by comparing scores with actual correctness on held-out examples from the test set.</p>"
            ]
      },
      {
            "title": "Single-image inference",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>How would you write <code>predict_clothing(image, probability_model)</code> for one (already normalized) 28x28 image? Validate its shape and finite <code>[0, 1]</code> values, add a batch dimension, and return the class name and score.</p>"
            ],
            "answers": [
                  "<p>This function makes the satisfying the input contract explicit. Normalize raw images using the same function as training images.</p>",
                  "<pre><code>def predict_clothing(image, probability_model):\n    image = np.asarray(image, dtype=np.float32)\n    if image.shape != (28, 28):\n        raise ValueError('Expected one 28 x 28 image')\n    if not np.isfinite(image).all() or image.min() &lt; 0 or image.max() &gt; 1:\n        raise ValueError('Expected finite pixel values in [0, 1]')\n    scores = probability_model.predict(image[np.newaxis, ...], verbose=0)[0] # Get the predicted probabilities for each class\n    label = int(np.argmax(scores)) # Get the index of the class with the highest predicted probability\n    return class_names[label], float(scores[label]) # Get the predicted class name and the predicted probability for that class\n\nprint(predict_clothing(test_images[1], probability_model))</code></pre>"
            ]
      },
      {
            "title": "A reusable model and CI smoke test",
            "prompt": "Discuss the question, then reveal its answer.",
            "questions": [
                  "<p>Right now, the notebook builds the model with the layer size fixed at 128. How would you extract model construction into <code>build_model(hidden_units=128)</code> and write a small CI smoke test that checks output shape and completes one training step on synthetic data?</p>"
            ],
            "answers": [
                  "<p>Place the builder in <code>train_eval.py</code>, the settings in a configuration, and the smoke test in your tests. The test checks that the pipeline runs.</p>",
                  "<pre><code>def build_model(hidden_units=128):\n    return tf.keras.Sequential([\n        tf.keras.Input(shape=(28, 28)),\n        tf.keras.layers.Flatten(),\n        tf.keras.layers.Dense(hidden_units, activation='relu'),\n        tf.keras.layers.Dense(10),\n    ])\n\nsmoke_model = build_model(hidden_units=8)\nsmoke_model.compile(\n    optimizer='adam',\n    loss=tf.keras.losses.SparseCategoricalCrossentropy(from_logits=True),\n    metrics=['accuracy'],\n)\nsmoke_images = np.zeros((2, 28, 28), dtype=np.float32)\nsmoke_labels = np.array([0, 1], dtype=np.int32)\nassert tuple(smoke_model(smoke_images).shape) == (2, 10)\nsmoke_loss, _ = smoke_model.train_on_batch(smoke_images, smoke_labels)\nassert np.isfinite(smoke_loss)\nprint('Smoke test passed')</code></pre>"
            ]
      }
];

    const els = {
      slide: document.querySelector('#slide'),
      eyebrow: document.querySelector('#eyebrow'),
      title: document.querySelector('#topic-title'),
      prompt: document.querySelector('#prompt'),
      questions: document.querySelector('#questions'),
      answers: document.querySelector('#answers'),
      answerPanel: document.querySelector('#answer-panel'),
      answerCount: document.querySelector('#answer-count'),
      reveal: document.querySelector('#reveal'),
      previous: document.querySelector('#previous'),
      next: document.querySelector('#next'),
      counter: document.querySelector('#counter'),
      progress: document.querySelector('#progress'),
      dots: document.querySelector('#dots')
    };

    let current = 0;
    let revealedCount = 0;

    function buildDots() {
      slides.forEach((slide, index) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'dot';
        dot.setAttribute('aria-label', `Go to question ${index + 1}: ${slide.title}`);
        dot.addEventListener('click', () => show(index));
        els.dots.appendChild(dot);
      });
    }

    function show(index) {
      current = Math.max(0, Math.min(index, slides.length - 1));
      revealedCount = 0;
      const data = slides[current];

      els.slide.classList.remove('revealed');
      els.eyebrow.textContent = `Question ${current + 1} of ${slides.length}`;
      els.title.textContent = data.title;
      els.prompt.textContent = data.prompt;
      els.questions.innerHTML = data.questions.map(question =>
        `<li>${question}</li>`
      ).join('');
      els.answers.innerHTML = data.answers.map(answer => `<li>${answer}</li>`).join('');
      els.answers.scrollTop = 0;
      els.counter.textContent = `${current + 1} / ${slides.length}`;
      els.progress.style.width = `${((current + 1) / slides.length) * 100}%`;
      els.previous.disabled = current === 0;
      updateAnswerState();

      [...els.dots.children].forEach((dot, i) => {
        dot.classList.toggle('active', i === current);
        dot.setAttribute('aria-current', i === current ? 'step' : 'false');
      });
    }

    function updateAnswerState() {
      const total = slides[current].answers.length;
      const answerItems = [...els.answers.children];
      els.slide.classList.toggle('revealed', revealedCount > 0);
      answerItems.forEach((item, index) => {
        const visible = index < revealedCount;
        item.classList.toggle('visible', visible);
        item.setAttribute('aria-hidden', String(!visible));
      });
      els.answerCount.textContent = revealedCount > 0 ? `${revealedCount} of ${total}` : 'Key ideas';

      if (revealedCount < total) {
        els.next.textContent = revealedCount === 0 ? 'Reveal answer →' : 'Reveal next →';
        els.next.setAttribute('aria-label', `Reveal answer ${revealedCount + 1} of ${total}`);
      } else if (current === slides.length - 1) {
        els.next.textContent = 'Start over ↺';
        els.next.setAttribute('aria-label', 'Return to the first question');
      } else {
        els.next.textContent = 'Next →';
        els.next.setAttribute('aria-label', 'Next question');
      }
    }

    function revealNext() {
      const total = slides[current].answers.length;
      if (revealedCount < total) {
        revealedCount += 1;
        updateAnswerState();
      }
    }

    function stepForward() {
      if (revealedCount < slides[current].answers.length) return revealNext();
      show(current === slides.length - 1 ? 0 : current + 1);
    }

    function previous() {
      if (current > 0) show(current - 1);
    }

    els.reveal.addEventListener('click', revealNext);
    els.next.addEventListener('click', stepForward);
    els.previous.addEventListener('click', previous);

    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight' || event.key === 'PageDown') stepForward();
      if (event.key === 'ArrowLeft' || event.key === 'PageUp') previous();
      if (event.key === ' ' && !['INPUT', 'TEXTAREA'].includes(event.target.tagName)) {
        event.preventDefault();
        stepForward();
      }
      if (event.key.toLowerCase() === 'r') revealNext();
      if (event.key === 'Home') show(0);
      if (event.key === 'End') show(slides.length - 1);
    });

    buildDots();
    show(0);
  </script>
